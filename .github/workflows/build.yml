name: Build Frost Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name "Frost Client" frost_client.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: FrostClient-Windows
          path: dist/Frost Client.exe
